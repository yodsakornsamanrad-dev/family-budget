<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Budget Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; }
        .glass-card { background: #ffffff; border: 1px solid #eef0f2; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .transaction-row:active { transform: scale(0.99); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 antialiased pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold tracking-tight text-gray-800"><i class="fa-solid fa-wallet mr-2 text-blue-600"></i>Family Budget</h1>
        <div class="text-sm font-medium text-gray-500" id="currentDate"></div>
    </header>

    <main class="max-w-3xl mx-auto p-4 mt-2">
        
        <!-- Tab Navigation -->
        <div class="flex bg-gray-200 p-1 rounded-xl mb-6 shadow-inner">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-gray-800">📊 Dashboard</button>
            <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all hover:text-gray-800">✏️ เพิ่ม/แก้ไขรายการ</button>
        </div>

        <!-- ================= DASHBOARD VIEW ================= -->
        <div id="view-dashboard" class="space-y-6">
            
            <!-- เลือกเดือน/ปี -->
            <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                <label class="text-sm font-bold text-gray-600"><i class="fa-regular fa-calendar-days mr-2"></i>อ้างอิงข้อมูล</label>
                <div class="flex gap-2">
                    <select id="monthSelect" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 font-medium">
                        <option value="01">มกราคม</option>
                        <option value="02">กุมภาพันธ์</option>
                        <option value="03">มีนาคม</option>
                        <option value="04">เมษายน</option>
                        <option value="05">พฤษภาคม</option>
                        <option value="06">มิถุนายน</option>
                        <option value="07">กรกฎาคม</option>
                        <option value="08">สิงหาคม</option>
                        <option value="09">กันยายน</option>
                        <option value="10">ตุลาคม</option>
                        <option value="11">พฤศจิกายน</option>
                        <option value="12">ธันวาคม</option>
                    </select>
                    <select id="yearSelect" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 font-medium">
                        <!-- ปีจะสร้างโดยอัตโนมัติจาก JS -->
                    </select>
                </div>
            </div>

            <!-- View Mode Filter (สลับมุมมอง) -->
            <div class="flex gap-2 bg-white p-1.5 rounded-xl border border-gray-200 shadow-sm overflow-x-auto hide-scroll">
                <button onclick="setViewMode('month')" data-mode="month" class="view-btn flex-1 py-2 px-3 rounded-lg text-[13px] font-bold bg-blue-600 text-white shadow-md transition-all whitespace-nowrap">เดือนที่เลือก</button>
                <button onclick="setViewMode('3weeks')" data-mode="3weeks" class="view-btn flex-1 py-2 px-3 rounded-lg text-[13px] font-medium bg-transparent text-gray-600 hover:bg-gray-100 transition-all whitespace-nowrap">3 สัปดาห์ล่าสุด</button>
                <button onclick="setViewMode('3months')" data-mode="3months" class="view-btn flex-1 py-2 px-3 rounded-lg text-[13px] font-medium bg-transparent text-gray-600 hover:bg-gray-100 transition-all whitespace-nowrap">3 เดือนล่าสุด</button>
                <button onclick="setViewMode('year')" data-mode="year" class="view-btn flex-1 py-2 px-3 rounded-lg text-[13px] font-medium bg-transparent text-gray-600 hover:bg-gray-100 transition-all whitespace-nowrap">ปีที่เลือก</button>
            </div>

            <!-- Summary Section -->
            <div>
                <!-- การเงินสะสมรวม (Net Worth) -->
                <div class="rounded-2xl p-6 mb-4 bg-gradient-to-br from-slate-800 to-black text-white shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 opacity-10 text-9xl transform translate-x-1/4 -translate-y-1/4">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-sm text-slate-300 font-medium">เงินคงเหลือรวมสะสม (ถึงสิ้น <span class="period-text"></span>)</p>
                            <i class="fa-solid fa-vault text-slate-400"></i>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-bold tracking-tight" id="total-accumulated-balance">฿0</h2>
                        <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between items-center text-xs font-medium">
                            <span class="text-slate-400">ยอดยกมาก่อนหน้า: <span id="previous-balance" class="text-slate-200 ml-1">฿0</span></span>
                        </div>
                    </div>
                </div>

                <!-- รายรับ - รายจ่าย -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="glass-card rounded-2xl p-5 border-l-4 border-green-500 flex flex-col justify-between">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 line-clamp-1">รายรับ (<span class="period-text text-[10px]"></span>)</p>
                        <h3 class="text-xl font-bold text-green-600 truncate">฿<span id="income-total">0</span></h3>
                    </div>
                    <div class="glass-card rounded-2xl p-5 border-l-4 border-red-500 flex flex-col justify-between">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 line-clamp-1">รายจ่าย (<span class="period-text text-[10px]"></span>)</p>
                        <h3 class="text-xl font-bold text-red-500 truncate">฿<span id="expense-total">0</span></h3>
                    </div>
                </div>

                <!-- สถานะ -->
                <div id="balance-card" class="glass-card rounded-2xl p-4 mb-4 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-1">สรุปผลรายรับ-รายจ่าย (<span class="period-text"></span>)</p>
                        <h3 class="text-lg font-bold" id="net-balance">฿0</h3>
                    </div>
                    <div id="balance-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-lg">
                        <i class="fa-solid fa-equals"></i>
                    </div>
                </div>

                <!-- สัดส่วนค่าใช้จ่ายตามสมาชิก -->
                <div class="glass-card rounded-2xl p-4">
                    <h3 class="text-sm font-bold mb-3 text-gray-600"><i class="fa-solid fa-users mr-2"></i>สรุปค่าใช้จ่ายตามสมาชิก (<span class="period-text text-xs"></span>)</h3>
                    <div id="userExpenseSummary" class="space-y-1">
                        <!-- ข้อมูลจะถูกสร้างด้วย JS -->
                    </div>
                </div>
            </div>

            <!-- Chart: Trend Bar Chart -->
            <div class="glass-card rounded-2xl p-5">
                <h3 class="text-md font-bold mb-2 text-gray-700">แนวโน้มรายจ่าย (บาท)</h3>
                <div class="relative h-80 w-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Chart: Category Donut -->
            <div class="glass-card rounded-2xl p-5">
                <h3 class="text-md font-bold mb-2 text-gray-700">สัดส่วนตามหมวดหมู่ (<span class="period-text text-sm"></span>)</h3>
                <div class="relative h-80 w-full mb-2">
                    <canvas id="expenseChart"></canvas>
                </div>
                <div id="categoryList" class="space-y-2 mt-4"></div>
            </div>

            <!-- Transaction Details -->
            <div class="glass-card rounded-2xl p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-md font-bold text-gray-700">รายการบันทึก (<span class="period-text text-sm"></span>)</h3>
                    <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded">แตะเพื่อแก้ไข</span>
                </div>
                
                <!-- FILTER BUTTONS -->
                <div id="categoryFilterContainer" class="flex gap-2 overflow-x-auto hide-scroll mb-4 pb-2 border-b border-gray-100">
                    <!-- ปุ่มจะสร้างด้วย JS -->
                </div>

                <div id="transactionDetails" class="space-y-3">
                    <!-- รายการจะถูกสร้างด้วย JS -->
                </div>
            </div>

            <button onclick="fetchData()" class="w-full py-4 bg-white hover:bg-gray-50 text-gray-600 font-bold rounded-xl text-sm transition-colors border border-gray-200 shadow-sm">
                <i class="fa-solid fa-rotate-right mr-2"></i>รีเฟรชข้อมูล
            </button>
        </div>

        <!-- ================= ADD / EDIT RECORD VIEW ================= -->
        <div id="view-add" class="hidden">
            <div class="glass-card rounded-2xl p-6">
                <h2 id="formTitle" class="text-lg font-bold mb-4 text-gray-800 border-b pb-3">เพิ่มรายการใหม่</h2>
                
                <form id="recordForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">วันที่ทำรายการ</label>
                        <input type="date" id="recordDate" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">ประเภท</label>
                            <select id="type" onchange="updateCategoryOptions()" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-gray-50 font-medium" required>
                                <option value="expense">รายจ่าย</option>
                                <option value="income">รายรับ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">หมวดหมู่</label>
                            <select id="category" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-gray-50 font-medium" required></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">จำนวนเงิน (บาท)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" class="w-full p-3 border border-gray-200 rounded-xl text-xl font-bold focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50 text-blue-600" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">สมาชิกที่ทำรายการ</label>
                        <select id="user" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-gray-50 font-medium" required>
                            <option value="ครอบครัว-ส่วนรวม">ครอบครัว-ส่วนรวม</option>
                            <option value="คุณพ่อ-ส่วนตัว">คุณพ่อ-ส่วนตัว</option>
                            <option value="คุณแม่-ส่วนตัว">คุณแม่-ส่วนตัว</option>
                            <option value="คุณลูก-ส่วนตัว">คุณลูก-ส่วนตัว</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">บันทึกเพิ่มเติม (ถ้ามี)</label>
                        <input type="text" id="note" placeholder="เช่น ค่าทางด่วน, ค่าข้าว, ซื้อของ7/11..." class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-gray-50">
                    </div>
                    <div class="flex gap-3 mt-6 pt-4 border-t border-gray-100">
                        <button type="button" id="deleteBtn" onclick="deleteRecordPrompt()" class="hidden flex-1 py-4 bg-red-50 border border-red-200 text-red-600 font-bold rounded-xl hover:bg-red-100 transition-all shadow-sm">ลบ</button>
                        <button type="button" id="cancelEditBtn" onclick="resetFormMode()" class="hidden flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-all shadow-sm">ยกเลิก</button>
                        <button type="submit" id="submitBtn" class="flex-[2] py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all shadow-md">บันทึกข้อมูล</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- JS Logic -->
    <script>
        // *** เปลี่ยน URL API Google Apps Script ของคุณที่นี่ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIRpGgZ2qiXCCgSzt89zwrc7lfsW-jrTSrAhN5IQa2BkXlw1XO2ul2UE8cA5W2P5hh/exec';
        
        Chart.register(ChartDataLabels);

        let donutChartInstance = null;
        let barChartInstance = null;
        let allData = [];
        let editMode = false;
        let editRowId = null;
        let currentViewMode = 'month'; 
        
        // ตัวแปรสำหรับ Filter
        let currentFilteredPeriodData = [];
        let currentCategoryFilter = 'all';

        const categoryColorMap = {
            'อาหาร': '#2a78d6',              
            'เดินทาง': '#eb6834',            
            'บิล': '#eda100',                
            'ของใช้ในบ้าน': '#1baf7a',         
            'ของใช้ส่วนตัว': '#e87ba4',        
            'ประกัน/ออม': '#4a3aa7',          
            'ผ่อนรถ': '#008300',             
            'จ่ายหนี้บัตร/คืนเงิน': '#e34948',  
            'ผ่อนบ้าน/คอนโด': '#64748b',       
            'โรงแรม/ที่พัก': '#14b8a6',       
            'ประกันรถยนต์': '#8b5cf6',
            'การลงทุน': '#0ea5e9', 
            'อื่นๆ': '#a8a6a0'                
        };
        const fallbackColors = ['#2a78d6', '#eb6834', '#eda100', '#1baf7a', '#e87ba4', '#4a3aa7', '#008300', '#e34948', '#64748b', '#a8a6a0'];

        function getCategoryColor(categoryName, index) {
            return categoryColorMap[categoryName] || fallbackColors[index % fallbackColors.length];
        }

        const memberColorMap = {
            'ครอบครัว-ส่วนรวม': '#2a78d6',   
            'คุณพ่อ-ส่วนตัว': '#eb6834',      
            'คุณแม่-ส่วนตัว': '#e87ba4',      
            'คุณลูก-ส่วนตัว': '#1baf7a'       
        };
        const memberFallbackColors = ['#4a3aa7', '#008300', '#eda100', '#e34948', '#64748b'];

        function getMemberColor(userName, index) {
            return memberColorMap[userName] || memberFallbackColors[index % memberFallbackColors.length];
        }

        const categoriesByType = {
            expense: [
                { value: 'อาหาร', text: 'อาหาร/เครื่องดื่ม' },
                { value: 'เดินทาง', text: 'เดินทาง' },
                { value: 'บิล', text: 'ค่าน้ำ/ไฟ/เน็ต' },
                { value: 'ของใช้ในบ้าน', text: 'ของใช้ในบ้าน' },
                { value: 'ของใช้ส่วนตัว', text: 'ของใช้ส่วนตัว' },
                { value: 'ประกัน/ออม', text: 'ประกันชีวิต/เงินออม' },
                { value: 'ผ่อนรถ', text: 'ผ่อนรถ' },
                { value: 'ผ่อนบ้าน/คอนโด', text: 'ผ่อนบ้าน/คอนโด' },
                { value: 'โรงแรม/ที่พัก', text: 'โรงแรม/ที่พัก' },
                { value: 'ประกันรถยนต์', text: 'ประกันรถยนต์' },
                { value: 'จ่ายหนี้บัตร/คืนเงิน', text: '💳 จ่ายหนี้/คืนเงินกู้' },
                { value: 'การลงทุน', text: '📈 การลงทุน/ซื้อสินทรัพย์' }, 
                { value: 'อื่นๆ', text: 'อื่นๆ' }
            ],
            income: [
                { value: 'รายได้', text: 'รายได้/เงินเดือน' },
                { value: 'ธุรกิจ', text: 'รายได้ธุรกิจ/ฟรีแลนซ์' },
                { value: 'การลงทุน', text: 'เงินปันผล/การลงทุน' },
                { value: 'ดึงเงินเก็บ', text: '💰 ดึงเงินเก็บมาใช้' },
                { value: 'เงินกู้ยืม', text: '💳 รูดบัตร/ยืมเงินมาใช้' },
                { value: 'อื่นๆ', text: 'อื่นๆ' }
            ]
        };

        const headerOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH', headerOptions);

        const today = new Date();
        const localDateString = today.toLocaleDateString('en-CA'); 
        document.getElementById('recordDate').value = localDateString;
        
        const currentMonthString = String(today.getMonth() + 1).padStart(2, '0');
        document.getElementById('monthSelect').value = currentMonthString;

        document.getElementById('monthSelect').addEventListener('change', () => setViewMode('month'));
        document.getElementById('yearSelect').addEventListener('change', () => {
            if (currentViewMode !== 'month' && currentViewMode !== 'year') setViewMode('year');
            else renderDashboard();
        });

        // Initialize App
        window.onload = function() {
            updateCategoryOptions();
            fetchData();
        };

        function parseRowDate(dateStr) {
            if (typeof dateStr === 'string' && dateStr.includes('-')) {
                const parts = dateStr.split('T')[0].split('-');
                if (parts.length === 3) return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            }
            return new Date(dateStr);
        }

        function updateCategoryOptions() {
            const type = document.getElementById('type').value;
            const categorySelect = document.getElementById('category');
            const previousValue = categorySelect.value;
            categorySelect.innerHTML = '';
            categoriesByType[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.value;
                opt.textContent = cat.text;
                categorySelect.appendChild(opt);
            });
            if (Array.from(categorySelect.options).some(opt => opt.value === previousValue)) categorySelect.value = previousValue;
        }

        function switchTab(tab) {
            if (tab === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
                document.getElementById('view-add').classList.add('hidden');
                document.getElementById('tab-dashboard').className = 'flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-gray-800';
                document.getElementById('tab-add').className = 'flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all hover:text-gray-800';
                if(allData.length === 0) fetchData(); 
            } else {
                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-add').classList.remove('hidden');
                document.getElementById('tab-add').className = 'flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-gray-800';
                document.getElementById('tab-dashboard').className = 'flex-1 py-2 rounded-lg text-sm font-medium text-gray-500 transition-all hover:text-gray-800';
            }
        }

        // --- แก้ไขการจัดการ Class เวลากดสลับมุมมอง ---
        function setViewMode(mode) {
            currentViewMode = mode;
            document.querySelectorAll('.view-btn').forEach(btn => {
                if(btn.dataset.mode === mode) {
                    // ปุ่มที่ถูกเลือก: ใส่สีฟ้า และเอาคลาส hover:bg-gray-100 ออก เพื่อแก้ปัญหาบั๊กสีทับกัน
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'font-bold');
                    btn.classList.remove('bg-transparent', 'text-gray-600', 'hover:bg-gray-100', 'font-medium');
                } else {
                    // ปุ่มที่ไม่ถูกเลือก: โปร่งใส และใส่ hover:bg-gray-100 กลับเข้าไป
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'font-bold');
                    btn.classList.add('bg-transparent', 'text-gray-600', 'hover:bg-gray-100', 'font-medium');
                }
            });
            renderDashboard();
        }

        function resetFormMode() {
            editMode = false;
            editRowId = null;
            document.getElementById('recordForm').reset();
            document.getElementById('recordDate').value = localDateString;
            updateCategoryOptions();
            document.getElementById('formTitle').innerText = 'เพิ่มรายการใหม่';
            document.getElementById('submitBtn').innerHTML = 'บันทึกข้อมูล';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('deleteBtn').classList.add('hidden');
        }

        function editRecord(sheetRow) {
            const record = allData.find(r => r.sheetRow === sheetRow);
            if (!record) return;
            const d = parseRowDate(record.date);
            document.getElementById('recordDate').value = d.toLocaleDateString('en-CA');
            document.getElementById('type').value = record.type;
            updateCategoryOptions(); 
            document.getElementById('category').value = record.category;
            document.getElementById('amount').value = record.amount;
            document.getElementById('user').value = record.user || 'ครอบครัว-ส่วนรวม';
            document.getElementById('note').value = record.note || '';

            editMode = true;
            editRowId = sheetRow;
            document.getElementById('formTitle').innerText = `แก้ไขรายการ (แถวที่ ${sheetRow})`;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-pen mr-2"></i>อัปเดตข้อมูล';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('deleteBtn').classList.remove('hidden');

            switchTab('add');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecordPrompt() {
            if (!editRowId) return;
            if (confirm(`คุณต้องการลบรายการแถวที่ ${editRowId} ใช่หรือไม่?`)) {
                const btn = document.getElementById('deleteBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>ลบ...';
                btn.disabled = true;
                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', row: editRowId }) })
                .then(res => res.json())
                .then(resData => {
                    alert('ลบรายการเรียบร้อยแล้ว!');
                    resetFormMode();
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    fetchData();
                    switchTab('dashboard');
                })
                .catch(err => {
                    alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                });
            }
        }

        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังบันทึก...';
            btn.disabled = true;

            const data = {
                action: editMode ? 'update' : 'add', 
                row: editRowId, 
                date: document.getElementById('recordDate').value,
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                user: document.getElementById('user').value,
                note: document.getElementById('note').value
            };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(resData => {
                alert(editMode ? 'อัปเดตรายการเรียบร้อยแล้ว!' : 'บันทึกข้อมูลเรียบร้อยแล้ว!');
                resetFormMode(); 
                btn.disabled = false;
                fetchData(); 
                switchTab('dashboard'); 
            })
            .catch(err => {
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });

        function updateYearSelectOptions() {
            const yearSelect = document.getElementById('yearSelect');
            const currentYear = new Date().getFullYear();
            const years = new Set([currentYear, currentYear - 1]);
            
            allData.forEach(row => {
                if (row.date) {
                    const y = parseRowDate(row.date).getFullYear();
                    if (!isNaN(y) && y > 2000) years.add(y);
                }
            });
            const sortedYears = Array.from(years).sort((a, b) => b - a);
            const previousValue = yearSelect.value || currentYear.toString();
            
            yearSelect.innerHTML = '';
            sortedYears.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y.toString();
                opt.textContent = y.toString();
                yearSelect.appendChild(opt);
            });
            yearSelect.value = previousValue;
        }

        function fetchData() {
            const btn = document.querySelector('button[onclick="fetchData()"]');
            if(btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังดึงข้อมูล...';
                
                fetch(SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        allData = data.map((item, index) => { return { ...item, sheetRow: index + 2 }; }); 
                        updateYearSelectOptions();
                        renderDashboard(); 
                        btn.innerHTML = originalText;
                    })
                    .catch(err => {
                        console.error(err);
                        btn.innerHTML = originalText;
                        alert('ไม่สามารถโหลดข้อมูลได้ โปรดตรวจสอบ URL ของ Google Script');
                    });
            }
        }

        // ฟังค์ชันสำหรับตั้งค่า Filter ปัจจุบัน แล้วอัปเดต UI
        function setCategoryFilter(category) {
            currentCategoryFilter = category;
            renderCategoryFilters();
            renderTransactionList();
        }

        // ฟังค์ชันสำหรับวาดปุ่ม Filter หมวดหมู่
        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilterContainer');
            if (!container) return;
            
            // ดึงหมวดหมู่ที่ไม่ซ้ำกันในข้อมูลปัจจุบัน (ของรอบเวลาที่เลือก)
            const uniqueCategories = [...new Set(currentFilteredPeriodData.map(item => item.category || 'อื่นๆ'))];
            
            if (uniqueCategories.length === 0) {
                container.innerHTML = '';
                return;
            }

            // ปุ่มรวมทั้งหมด
            let html = `<button onclick="setCategoryFilter('all')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-[13px] font-bold transition-all border ${currentCategoryFilter === 'all' ? 'bg-gray-800 border-gray-800 text-white' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}">รวมทั้งหมด</button>`;
            
            // ปุ่มหมวดหมู่ย่อยๆ
            uniqueCategories.forEach(cat => {
                const isActive = currentCategoryFilter === cat;
                const btnClass = isActive ? 'bg-blue-600 border-blue-600 text-white shadow-sm' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50';
                html += `<button onclick="setCategoryFilter('${cat}')" class="whitespace-nowrap px-3 py-1.5 rounded-full text-[13px] font-medium transition-all border ${btnClass}">${cat}</button>`;
            });
            
            container.innerHTML = html;
        }

        // --- แก้ไขส่วนตาราง Transaction เพื่อแสดงวันที่แทนลูกศร ---
        function renderTransactionList() {
            const transDiv = document.getElementById('transactionDetails');
            transDiv.innerHTML = '';
            
            // กรองข้อมูลตามหมวดหมู่ที่ถูกเลือก
            let displayData = currentFilteredPeriodData;
            if (currentCategoryFilter !== 'all') {
                displayData = currentFilteredPeriodData.filter(item => (item.category || 'อื่นๆ') === currentCategoryFilter);
            }

            if (displayData.length === 0) {
                transDiv.innerHTML = '<div class="text-center p-6 text-gray-400 text-sm">ไม่มีรายการในหมวดนี้</div>';
            } else {
                const mNamesShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                
                displayData.forEach(row => {
                    const isIncome = row.type === 'income';
                    const amountStr = isIncome ? `+฿${parseFloat(row.amount).toLocaleString('th-TH')}` : `-฿${parseFloat(row.amount).toLocaleString('th-TH')}`;
                    const amountColor = isIncome ? 'text-green-600' : 'text-red-500';
                    
                    const d = parseRowDate(row.date);
                    const day = d.getDate().toString();
                    const monthStr = mNamesShort[d.getMonth()];
                    
                    // สร้างไอคอนเป็นวันที่และเดือน
                    const dateIcon = `
                        <div class="flex flex-col items-center justify-center leading-none">
                            <span class="text-[14px] font-bold text-gray-700">${day}</span>
                            <span class="text-[10px] text-gray-500 mt-0.5">${monthStr}</span>
                        </div>
                    `;
                    
                    transDiv.innerHTML += `
                        <div onclick="editRecord(${row.sheetRow})" class="transaction-row flex justify-between items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 cursor-pointer border border-transparent hover:border-gray-200 transition-all">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-xl bg-white flex items-center justify-center shadow-sm border border-gray-100 flex-shrink-0">
                                    ${dateIcon}
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-gray-800 leading-tight">${row.category}</p>
                                    <p class="text-[11px] text-gray-500 mt-0.5 line-clamp-1">${row.user || ''} ${row.note ? '• '+row.note : ''}</p>
                                </div>
                            </div>
                            <span class="font-bold text-sm ${amountColor}">${amountStr}</span>
                        </div>
                    `;
                });
            }
        }

        function renderDashboard() {
            if(allData.length === 0) return;

            // รีเซ็ต Filter กลับเป็นทั้งหมด เมื่อมีการสลับมุมมองหรือโหลดข้อมูลใหม่
            currentCategoryFilter = 'all';

            const now = new Date();
            now.setHours(0,0,0,0);
            
            const filterMonthStr = document.getElementById('monthSelect').value;
            const filterYearStr = document.getElementById('yearSelect').value;
            const filterMonth = parseInt(filterMonthStr);
            const filterYear = parseInt(filterYearStr);
            
            let startDate = new Date();
            let endDate = new Date();
            let xAxisLabels = [];
            let groupByKey = (d) => '';
            let periodText = '';
            
            const mNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

            // จัดการเรื่อง Period ที่จะใช้กรองข้อมูล
            if (currentViewMode === 'month') {
                startDate = new Date(filterYear, filterMonth - 1, 1);
                endDate = new Date(filterYear, filterMonth, 0); 
                const daysInMonth = endDate.getDate();
                for(let i = 1; i <= daysInMonth; i++) xAxisLabels.push(i.toString());
                groupByKey = (d) => d.getDate().toString();
                periodText = `เดือน ${mNames[filterMonth-1]} ${filterYear+543}`;
            } 
            else if (currentViewMode === '3weeks') {
                endDate = new Date(now);
                startDate = new Date(now);
                startDate.setDate(now.getDate() - 20); 
                for(let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    xAxisLabels.push(`${d.getDate()}/${d.getMonth()+1}`);
                }
                groupByKey = (d) => `${d.getDate()}/${d.getMonth()+1}`;
                periodText = '3 สัปดาห์ล่าสุด';
            } 
            else if (currentViewMode === '3months') {
                endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0); 
                startDate = new Date(now.getFullYear(), now.getMonth() - 2, 1); 
                for(let i = 0; i < 3; i++) {
                    let m = startDate.getMonth() + i;
                    let y = startDate.getFullYear();
                    if (m > 11) { m -= 12; y++; }
                    xAxisLabels.push(`${mNames[m]} ${y.toString().slice(-2)}`);
                }
                groupByKey = (d) => `${mNames[d.getMonth()]} ${d.getFullYear().toString().slice(-2)}`;
                periodText = '3 เดือนล่าสุด';
            } 
            else if (currentViewMode === 'year') {
                startDate = new Date(filterYear, 0, 1);
                endDate = new Date(filterYear, 11, 31);
                xAxisLabels = [...mNames];
                groupByKey = (d) => mNames[d.getMonth()];
                periodText = `ปี ${filterYear+543}`;
            }

            // Update UI text
            document.querySelectorAll('.period-text').forEach(el => el.innerText = periodText);

            // คำนวณข้อมูล
            let currentIncome = 0;
            let currentExpense = 0;
            let previousBalance = 0; 
            
            currentFilteredPeriodData = [];
            let dailyExpenses = {};
            let categoryTotals = {};
            let userTotals = {};

            xAxisLabels.forEach(label => dailyExpenses[label] = 0);

            const startOnly = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const endOnly = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());

            allData.forEach(row => {
                if (!row.date || !row.amount) return;
                
                const d = parseRowDate(row.date);
                const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const amount = parseFloat(row.amount);
                const isExpense = row.type === 'expense';
                const isIncome = row.type === 'income';

                // คำนวณยอดยกมา (ก่อนช่วงเวลาที่ดูอยู่)
                if (dOnly < startOnly) {
                    if (isIncome) previousBalance += amount;
                    if (isExpense) previousBalance -= amount;
                }

                // ข้อมูลของช่วงเวลาปัจจุบัน
                if (dOnly >= startOnly && dOnly <= endOnly) {
                    currentFilteredPeriodData.push(row);
                    
                    if (isIncome) {
                        currentIncome += amount;
                    } else if (isExpense) {
                        currentExpense += amount;
                        
                        // กราฟแท่ง
                        const key = groupByKey(d);
                        if (dailyExpenses[key] !== undefined) {
                            dailyExpenses[key] += amount;
                        }
                        
                        // หมวดหมู่
                        const cat = row.category || 'อื่นๆ';
                        categoryTotals[cat] = (categoryTotals[cat] || 0) + amount;
                        
                        // สมาชิก
                        const u = row.user || 'ครอบครัว-ส่วนรวม';
                        userTotals[u] = (userTotals[u] || 0) + amount;
                    }
                }
            });

            // --- อัปเดต Summary Cards ---
            document.getElementById('previous-balance').innerText = `฿${previousBalance.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('income-total').innerText = currentIncome.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('expense-total').innerText = currentExpense.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            const currentNet = currentIncome - currentExpense;
            const netBalanceEl = document.getElementById('net-balance');
            const balanceIcon = document.getElementById('balance-icon');
            
            netBalanceEl.innerText = `฿${currentNet.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            if (currentNet > 0) {
                netBalanceEl.className = 'text-lg font-bold text-green-600';
                balanceIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-lg bg-green-100 text-green-600';
                balanceIcon.innerHTML = '<i class="fa-solid fa-arrow-trend-up"></i>';
            } else if (currentNet < 0) {
                netBalanceEl.className = 'text-lg font-bold text-red-500';
                balanceIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-lg bg-red-100 text-red-500';
                balanceIcon.innerHTML = '<i class="fa-solid fa-arrow-trend-down"></i>';
            } else {
                netBalanceEl.className = 'text-lg font-bold text-gray-500';
                balanceIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-lg bg-gray-100 text-gray-500';
                balanceIcon.innerHTML = '<i class="fa-solid fa-equals"></i>';
            }

            const totalAccumulated = previousBalance + currentNet;
            document.getElementById('total-accumulated-balance').innerText = `฿${totalAccumulated.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            // --- Render User Summary ---
            const userSummaryDiv = document.getElementById('userExpenseSummary');
            userSummaryDiv.innerHTML = '';
            
            const sortedUsers = Object.entries(userTotals).sort((a, b) => b[1] - a[1]);
            
            if (sortedUsers.length === 0) {
                userSummaryDiv.innerHTML = '<p class="text-sm text-gray-400 italic">ไม่มีข้อมูลในรอบนี้</p>';
            } else {
                sortedUsers.forEach(([u, total], index) => {
                    const percent = currentExpense > 0 ? ((total / currentExpense) * 100).toFixed(1) : 0;
                    const color = getMemberColor(u, index);
                    
                    userSummaryDiv.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${color}"></div>
                                <span class="text-sm text-gray-700 font-medium">${u}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-bold text-gray-800">฿${total.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                                <span class="text-xs text-gray-500 ml-1">(${percent}%)</span>
                            </div>
                        </div>
                    `;
                });
            }

            // --- Render Bar Chart ---
            const barData = xAxisLabels.map(label => dailyExpenses[label]);
            if (barChartInstance) barChartInstance.destroy();
            const barCtx = document.getElementById('trendChart').getContext('2d');
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: xAxisLabels,
                    datasets: [{
                        label: 'รายจ่าย (บาท)',
                        data: barData,
                        backgroundColor: '#ef4444',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        datalabels: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [4, 4] } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // --- Render Donut Chart ---
            const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]);
            const catLabels = sortedCategories.map(item => item[0]);
            const catData = sortedCategories.map(item => item[1]);
            const catColors = catLabels.map((label, index) => getCategoryColor(label, index));

            if (donutChartInstance) donutChartInstance.destroy();
            const pieCtx = document.getElementById('expenseChart').getContext('2d');
            donutChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: catLabels,
                    datasets: [{ data: catData, backgroundColor: catColors, borderWidth: 2, borderColor: '#ffffff' }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 11 },
                            formatter: (value, ctx) => {
                                let sum = 0;
                                let dataArr = ctx.chart.data.datasets[0].data;
                                dataArr.map(data => { sum += data; });
                                let percentage = (value * 100 / sum).toFixed(0) + "%";
                                return percentage === "0%" ? "" : percentage;
                            }
                        }
                    }
                }
            });

            // Category Legend List
            const catListDiv = document.getElementById('categoryList');
            catListDiv.innerHTML = '';
            if (sortedCategories.length === 0) {
                catListDiv.innerHTML = '<p class="text-sm text-gray-400 italic text-center">ไม่มีรายการใช้จ่าย</p>';
            } else {
                sortedCategories.forEach(([cat, amt], index) => {
                    const percent = currentExpense > 0 ? ((amt / currentExpense) * 100).toFixed(1) : 0;
                    catListDiv.innerHTML += `
                        <div class="flex justify-between items-center text-sm p-1.5 hover:bg-gray-50 rounded-lg transition-colors">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full" style="background-color: ${catColors[index]}"></span>
                                <span class="font-medium text-gray-700">${cat}</span>
                            </div>
                            <div>
                                <span class="font-bold text-gray-800">฿${amt.toLocaleString('th-TH')}</span>
                                <span class="text-gray-400 text-xs w-10 inline-block text-right">${percent}%</span>
                            </div>
                        </div>
                    `;
                });
            }

            // --- จัดเรียงและวาดส่วนตาราง Transaction ด้านล่างสุด ---
            // เรียงข้อมูลจากวันที่ล่าสุด
            currentFilteredPeriodData.sort((a, b) => parseRowDate(b.date) - parseRowDate(a.date));
            
            // เรียกฟังก์ชั่นเพื่อวาดปุ่มหมวดหมู่ และวาดตาราง
            renderCategoryFilters();
            renderTransactionList();
        }
    </script>
</body>
</html>
